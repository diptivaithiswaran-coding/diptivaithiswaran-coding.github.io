<header class="site-header">
  <div class="header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Dipti Vaithiswaran, home">
      <span class="wordmark-mark" aria-hidden="true">D</span>
      <span>Dipti Vaithiswaran</span>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      {% for item in site.navigation %}
        <a
          href="{{ item.url | relative_url }}"
          {% if page.url == item.url %}aria-current="page"{% endif %}
        >{{ item.label }}</a>
      {% endfor %}
    </nav>
    <button class="theme-toggle" type="button" role="switch" data-theme-toggle aria-checked="false" aria-label="Dark mode">
      <span data-theme-label aria-hidden="true">Light</span>
      <span class="theme-toggle-track" aria-hidden="true">
        <span class="theme-toggle-thumb"></span>
      </span>
    </button>
  </div>
</header>
